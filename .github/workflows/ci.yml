name: CI
on:
  # pull_request only — the post-merge push-to-main run was redundant (PR CI already
  # gated the change) and just clogged the single self-hosted runner. On revert before
  # going public, restore `push: { branches: [main] }` alongside the hosted runner.
  pull_request:

concurrency:
  # One in-flight run per PR ref; a new push cancels the superseded run, so the single
  # self-hosted runner isn't wasted finishing stale commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ TEMPORARY (pre-launch, 2026-06) — self-hosted runner.
# GitHub-hosted Actions minutes are exhausted for the month, so the gate runs on a
# self-hosted Docker/Linux runner (Ubuntu 24.04, Python 3.12) on the maintainer's
# machine (self-hosted minutes are free).
#
# 🚨 REVERT BEFORE THE REPO GOES PUBLIC. A self-hosted runner on a PUBLIC repo lets a
#    malicious fork PR run arbitrary code on the maintainer's machine. Launch sequence:
#      1. deregister the runner, AND
#      2. restore a hosted config (e.g. `runs-on: macos-latest` / `ubuntu-latest` with
#         actions/setup-python), THEN
#      3. flip the repo public.
#    (Public repos get unlimited hosted Actions, so the runner isn't needed after launch.)

jobs:
  test:
    runs-on: [self-hosted, linux]   # TEMP: was `macos-latest` — see header / revert before public
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python: this self-hosted runner is Ubuntu 24.04 with Python
      # 3.12 (>=3.11), and setup-python has no arm64 build for older bases. Use the
      # system python via a venv (24.04 is PEP-668 "externally managed").
      - name: Create venv
        run: python3 -m venv .venv
      - name: Install
        run: |
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff format check
        run: .venv/bin/ruff format --check .
      - name: mypy
        run: .venv/bin/mypy src/rekol
      - name: pytest
        run: .venv/bin/pytest -q
      - name: bats install-script test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq
          bats tests/test_install.bats

  # NOTE: the separate `ubuntu-latest` portability job is dropped during the self-hosted
  # window — the gate runs on Linux natively (self-hosted). Restore it (and a hosted
  # `runs-on`) when reverting before the public flip.
