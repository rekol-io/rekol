name: CI
# HOSTED CI (prepared, held unmerged on branch `revert/ci-hosted`).
# Merge this ONLY as part of the coordinated public flip — see docs/launch-runbook.md.
# Safe sequence: (1) deregister the self-hosted runner, (2) merge THIS (hosted CI),
# (3) make the repo public. Do NOT flip public while the self-hosted runner is still
# attached — a self-hosted runner on a PUBLIC repo runs arbitrary code from any fork PR
# (RCE on the maintainer's machine). Public repos get free standard hosted runners, so
# after the flip these jobs run at no cost.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One in-flight run per ref; a new push cancels the superseded run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Native acceptance across all supported arches (launch): ubuntu-latest (x86_64
    # Linux — finally native, not QEMU) and macos-latest (Apple Silicon/arm64) are the
    # required gates; macos-13 (Intel) is OPTIONAL (continue-on-error) — best-effort
    # native Intel coverage that never blocks the merge and can be dropped if the free
    # macOS tier doesn't cover it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-13' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # base commit must be present for the git-diff bats gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      # Gate the slow bats install tests to only run when the install scripts — or
      # their hooks, the bats tests, or this workflow — change. A Python-only PR then
      # skips bats and the gate is just ruff/format/mypy/pytest. Detected via plain
      # `git diff` (portable across hosted Linux + macOS). Fail-safe: if the diff can't
      # be computed (e.g. a push event with no base), RUN bats.
      - name: Detect shell-script changes
        id: filter
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if changed="$(git diff --name-only "$base" HEAD 2>/dev/null)"; then
            if printf '%s\n' "$changed" | grep -qE '^(install|uninstall)\.sh$|^hooks/|^tests/test_(install|uninstall)\.bats$|^\.github/workflows/ci\.yml$'; then
              echo 'shell=true' >> "$GITHUB_OUTPUT"; echo 'shell scripts changed -> bats WILL run'
            else
              echo 'shell=false' >> "$GITHUB_OUTPUT"; echo 'no shell-script changes -> bats skipped'
            fi
          else
            echo 'shell=true' >> "$GITHUB_OUTPUT"; echo 'could not compute diff -> running bats (fail-safe)'
          fi
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src/rekol
      - name: pytest
        # Hard-offline for the model hub (#155). A unit test silently acquired a
        # network dependency by omitting `embedding_model: test-hashing`, and CI
        # went red twice — on a release PR and on a feature PR — for reasons
        # unrelated to the change under test. Offline turns that class of bug
        # from "intermittently red, re-run and shrug" into "always red, on the
        # offending test", which is the only version anyone acts on. Verified:
        # the whole suite passes offline (and ~3x faster, since nothing waits on
        # the network).
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -q
      - name: Install bats
        # OS-conditional: brew on macOS, apt on Linux (brew isn't the right installer on
        # Ubuntu). Only when shell scripts changed (see the gate above).
        if: steps.filter.outputs.shell == 'true'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi
      - name: bats install-script test
        if: steps.filter.outputs.shell == 'true'
        run: bats tests/test_install.bats
      # test_uninstall.bats was already in the change-filter above but was never
      # actually RUN, so nothing verified uninstall or — more importantly —
      # reinstall-after-uninstall. #159 broke exactly that path (install aborted
      # because settings.json has no `hooks` key post-uninstall) and CI would
      # have gone green. The gate has to run the suite it triggers on.
      - name: bats uninstall-script test
        if: steps.filter.outputs.shell == 'true'
        run: bats tests/test_uninstall.bats

  version-bump:
    # #102: enforce that every PR to main bumps the version (patch, or a deliberate
    # minor/major). This is a status CHECK, not an auto-push — it works cleanly with
    # branch protection (no bot pushing to a protected main). Fails the PR if
    # scripts/bump_version.py wasn't run. The bump itself stays a one-command manual
    # step; this just makes forgetting it impossible.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the PR base commit present to compare versions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce per-PR version bump
        run: python scripts/bump_version.py --assert-ahead-of "${{ github.event.pull_request.base.sha }}"
