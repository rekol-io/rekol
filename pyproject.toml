[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekol"
version = "0.1.0"
description = "Layered, cross-indexed memory system with local vector search for Claude Code"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0,<4",
    "sqlite-vec>=0.1.3",
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "python-frontmatter>=1.1,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
memory-index = "rekol.cli_index:main"
memory-search = "rekol.cli_search:main"
memory-capture = "rekol.cli_capture:main"
memory-invalidate = "rekol.cli_invalidate:main"
memory-propose = "rekol.cli_propose:main"
memory-migrate = "rekol.cli_migrate:main"
claude-session-index = "rekol.cli_session_index:main"
memory-docs-convert = "rekol.cli_docs_convert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "C90"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "N802", "N806", "B017", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
files = ["src/rekol"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sqlite_vec.*", "frontmatter.*"]
ignore_missing_imports = true
