[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekol"
version = "0.1.8"
description = "Layered, cross-indexed memory system with local vector search for Claude Code"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0,<4",
    "sqlite-vec>=0.1.3",
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "python-frontmatter>=1.1,<2",
    # NumPy is capped to <2 on Intel macOS: PyTorch stopped publishing recent
    # x86_64-darwin wheels, so the newest installable torch there is compiled
    # against NumPy 1.x and crashes ("_ARRAY_API not found") under NumPy 2.x on
    # the first embedding. arm64 macOS + Linux ship a torch that supports NumPy 2,
    # so they keep <3. (QA finding, clean Intel-mac install.)
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
rekol = "rekol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Put tests/ on sys.path so shared test helpers (cache_helpers) import cleanly
# regardless of the invocation cwd.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "C90"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "N802", "N806", "B017", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
files = ["src/rekol"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sqlite_vec.*", "frontmatter.*"]
ignore_missing_imports = true
